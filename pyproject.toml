[project]
name = "ai-control-certified-monitor"
version = "0.1.0"
description = "Certified thresholding utilities for AI Control Hackathon Track A."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monitor_cert*"]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["work", "outputs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["monitor_cert", "scripts", "tests"]
exclude = ["work", "outputs", ".venv"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
